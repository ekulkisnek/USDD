[workspace]
resolver = "2"
members = [
    "crates/usdd-core",
    "crates/usdd-proof-core",
    "crates/usdd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LayerTwo-Labs/usdd-protocol"

[workspace.dependencies]
sha2 = { version = "=0.10.8", default-features = false }
usdd-core = { path = "crates/usdd-core", default-features = false }
usdd-proof-core = { path = "crates/usdd-proof-core" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

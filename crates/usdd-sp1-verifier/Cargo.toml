[package]
name = "usdd-sp1-verifier"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Fail-closed SP1 6.3.1 raw compressed verifier adapter for USDD V1"
readme = "README.md"

[dependencies]
bincode = "=1.3.3"
slop-algebra = "=6.3.1"
sp1-hypercube = "=6.3.1"
sp1-primitives = "=6.3.1"
sp1-recursion-executor = { version = "=6.3.1", default-features = false }
sp1-verifier = { version = "=6.3.1", default-features = false, features = ["std"] }
usdd-core = { workspace = true }
usdd-proof-core = { workspace = true }

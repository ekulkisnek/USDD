[package]
name = "usdd-sp1-prover"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
default = ["usdd-host-patch"]
# Mandatory for this standalone crate. This feature does not change the guest
# or proof system; it makes emitted metadata attest the pinned host-only SP1
# orchestration dependency path.
usdd-host-patch = []

[patch.crates-io]
sp1-prover = { path = "toolchain/vendor/sp1-prover-6.3.1" }
sp1-sdk = { path = "toolchain/vendor/sp1-sdk-6.3.1" }

[dependencies]
anyhow = "=1.0.102"
bincode = "=1.3.3"
hex = "=0.4.3"
serde_json = "=1.0.150"
sha2 = "=0.10.8"
sp1-core-executor = "=6.3.1"
sp1-sdk = { version = "=6.3.1", default-features = false }
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
usdd-core = { path = "../../crates/usdd-core", features = ["std"] }
usdd-proof-core = { path = "../../crates/usdd-proof-core", features = ["std"] }
usdd-sp1-verifier = { path = "../../crates/usdd-sp1-verifier" }

[dev-dependencies]
# Exercise the patched controller decoder through this package's test target;
# Cargo cannot run dependency-crate unit tests from the standalone workspace.
sp1-prover = "=6.3.1"
